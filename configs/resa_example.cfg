[general]
run_name = resa_16x_32x32_subarrays

[architecture_presets]
ArrayHeight:    32
ArrayWidth:     32
IfmapSramSzkB:   512
FilterSramSzkB:  512
OfmapSramSzkB:   512
IfmapOffset:    0
FilterOffset:   10000000
OfmapOffset:    20000000
Bandwidth : 44
Dataflow : ws
MemoryBanks:   1
ReadRequestBuffer: 32
WriteRequestBuffer: 32

[layout]
IfmapCustomLayout: False
IfmapSRAMBankBandwidth: 44
IfmapSRAMBankNum: 10
IfmapSRAMBankPort: 2
FilterCustomLayout: False
FilterSRAMBankBandwidth: 44
FilterSRAMBankNum: 10
FilterSRAMBankPort: 2

[sparsity]
SparsitySupport : false
SparseRep : ellpack_block
OptimizedMapping : false
BlockSize : 8
RandomNumberGeneratorSeed : 40

[run_presets]
InterfaceBandwidth: CALC
UseRamulatorTrace: False

# ---------------------------------------------------------------------------
# ReSA-specific sections below. SCALE-Sim never reads these.
# ---------------------------------------------------------------------------

[resa_array]
PhysicalArrayHeight:    128
PhysicalArrayWidth:     128
SubArrayHeight:         32
SubArrayWidth:          32
SubArrayGridRows:       4
SubArrayGridCols:       4
ClockFrequencyMHz:      700
OperandBits:            16

[resa_buffer]
SubArraysPerGroup:      4
NumBufferGroups:        4
ReadWritePortsPerGroup: 1
CrossbarPorts:          4
BufferSizeKbPerGroup:   1536
OnChipBandwidthWordsPerCycle: 1024
PortModel:              bandwidth
PartialSumAccumulation: buffer
ArbitrationPolicy:      round_robin
MulticastScope:         same_cycle_same_group_same_address
GroupGeometry:          quadrant
CustomGroupMap:         0,0,1,1,0,0,1,1,2,2,3,3,2,2,3,3

[resa_noc]
HopLatencyCycles:       1
Unidirectional:         True

[resa_cost]
DataflowSwitchPenaltyCycles: auto

[resa_search]
RankingTilingsPerCell:  40
RankingMarginPercent:   25

[resa_memory]
OffChipBandwidthWordsPerCycle:  179
PerGroupBandwidthWordsPerCycle: 44
BandwidthRemainderPolicy:       unassigned
BandwidthEnforcement:           arbiter
